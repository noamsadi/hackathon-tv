<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workflows actions hackathon</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Lato:wght@400;700;900&display=swap">
<style>
html,body{margin:0;height:100%;background:#0C0C0B}
body{font-family:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.mc-av{display:inline-grid;place-items:center;flex-shrink:0;border-radius:50%;color:#fff;font-weight:600;background:var(--h);box-shadow:0 0 0 2px #fff}
.mc-av{position:relative;overflow:hidden}
.mc-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;background:var(--h)}
/* ===== TV mode: a 1920×1080 stage, scaled to fit. Quiet, dark, everything on screen ===== */
body.tv-on{overflow:hidden}
#tv{position:fixed;inset:0;z-index:9000;background:#0C0C0B;color:#ECEAE6;overflow:hidden}
#tv.idle{cursor:none}
#tv .svg{width:1em;height:1em}
#tv .tv-stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;box-sizing:border-box;padding:52px 60px 56px;display:flex;flex-direction:column;gap:32px;background:#0C0C0B}
.tv-ctl{position:absolute;top:16px;right:16px;display:flex;gap:8px;transition:opacity .3s}
#tv.idle .tv-ctl{opacity:0;pointer-events:none}
.tv-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:rgba(24,24,22,.9);color:#ECEAE6;font:inherit;font-size:13px;cursor:pointer}
.tv-btn:hover{background:#26251F}
.tv-top{display:flex;align-items:flex-end;justify-content:space-between}
.tv-title h1{margin:0;font-size:52px;line-height:1;font-weight:600;letter-spacing:-.03em}
.tv-top-r{display:flex;align-items:baseline;gap:36px}
.tv-live{display:inline-flex;align-items:center;gap:10px;font-size:19px;color:#7D7A75}
.tv-live i{width:9px;height:9px;border-radius:50%;background:#5C5A57}
.tv-live.on i{background:#4ADE80;animation:tvBreathe 3s ease-in-out infinite}
@keyframes tvBreathe{50%{opacity:.35}}
.tv-clock{font-size:52px;line-height:1;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#ECEAE6}
.tv-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:auto minmax(0,.86fr) minmax(0,1fr);gap:24px;
  grid-template-areas:"sum sum" "ship ship" "ppl grab"}
.tv-w{min-height:0;min-width:0;display:flex;flex-direction:column;gap:20px;padding:26px 28px;border-radius:22px;background:#151513;border:1px solid #1F1E1C}
.tv-sum{grid-area:sum;flex-direction:row;align-items:stretch;gap:0;padding:24px 0}
.tv-kpi{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding:0 32px;border-left:1px solid #24231F}
.tv-kpi:first-child{border-left:0}
.tv-kpi>span{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#A8A59F}
.tv-kpi>span i{width:9px;height:9px;border-radius:50%}
.tv-kpi>b{font-size:56px;line-height:1;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tv-kpi>b small{font-size:20px;font-weight:400;letter-spacing:0;color:#7D7A75}
.tv-prog-k{flex:2.2}
.tv-pk{display:flex;align-items:baseline;gap:18px}
.tv-pk b{font-size:56px;line-height:1;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tv-pk b small{font-size:28px;color:#7D7A75;font-weight:500;margin-left:2px}
.tv-pk em{font-style:normal;font-size:20px;color:#7D7A75}
.tv-w-shipped{grid-area:ship}.tv-w-people{grid-area:ppl}.tv-w-grabs{grid-area:grab}
.tv-wh{display:flex;align-items:center;gap:12px;color:#7D7A75;font-size:22px}
.tv-wh h3{margin:0;font-size:17px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#A8A59F}
.tv-n{font-size:17px;font-variant-numeric:tabular-nums;color:#7D7A75}
.tv-sp{flex:1}
/* the page timer: subtle dots, the current one fills */
.tv-dots{display:inline-flex;align-items:center;gap:6px}
.tv-dots i{width:6px;height:6px;border-radius:999px;background:#3A3936;overflow:hidden;transition:width .4s}
.tv-dots i.on{width:28px}
.tv-dots b{display:block;height:100%;background:#8E8B85;transform-origin:0 50%;animation-name:tvFill;animation-timing-function:linear;animation-fill-mode:both}
@keyframes tvFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tv-wb{flex:1;min-height:0;animation:tvIn .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes tvIn{from{opacity:0;transform:translateY(8px)}}
.tv-empty{height:100%;display:grid;place-items:center;font-size:21px;color:#5C5A57;border:1px dashed #2A2926;border-radius:16px}
/* summary */
.tv-bar{display:flex;gap:3px;height:6px}
.tv-bar i{width:var(--w);background:var(--c);border-radius:999px;transition:width 1s}
/* icon tiles */
.tv-ic{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;border-radius:12px;background:#ECEAE6;color:var(--c)}
.tv-ic .svg{width:22px!important;height:22px!important}
/* shipped */
.tv-ship{height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:16px}
.tv-sc{position:relative;display:flex;align-items:center;gap:16px;padding:0 22px;border-radius:16px;background:#1C1B19;animation:tvIn .7s calc(var(--j) * 70ms) both}
.tv-sc-x{min-width:0;display:flex;flex-direction:column;gap:10px}
.tv-sc-x b{font-size:22px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-sc-x>span{display:flex;align-items:center;gap:4px;min-width:0}
.tv-sc-x em{font-style:normal;font-size:16px;color:#7D7A75;margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-ok{position:absolute;top:14px;right:14px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:rgba(74,222,128,.14);color:#4ADE80;font-size:15px}
#tv .mc-av{box-shadow:0 0 0 2px #1C1B19}
.tv-person .mc-av{box-shadow:none}
/* who's on what */
.tv-ppl{height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:16px}
.tv-person{min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;gap:14px;padding:20px 22px;border-radius:16px;background:#1C1B19;animation:tvIn .7s calc(var(--j) * 80ms) both}
.tv-person-h{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.tv-person-h b{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-person-h em{margin-left:auto;font-style:normal;font-size:17px;color:#A5B4FC;font-variant-numeric:tabular-nums}
.tv-row{display:grid;grid-template-columns:minmax(0,1fr) 56px;align-items:center;gap:14px}
.tv-row-t{font-size:18px;color:#C9C6C0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-prog{height:4px;border-radius:999px;background:#2A2926;overflow:hidden}
.tv-prog i{display:block;height:100%;width:var(--w);background:#A5B4FC}
.tv-more{font-size:15px;line-height:1;color:#5C5A57}
/* up for grabs */
.tv-grabs{height:100%;display:grid;grid-template-rows:repeat(7,minmax(0,1fr))}
.tv-grab{display:grid;grid-template-columns:8px minmax(0,1fr) auto;align-items:center;gap:16px;border-bottom:1px solid #1F1E1C;animation:tvIn .6s calc(var(--j) * 45ms) both}
.tv-grab:last-child{border-bottom:0}
.tv-pri{width:8px;height:8px;border-radius:50%;background:#5C5A57}
.tv-pri.p-High{background:#F87171}.tv-pri.p-Medium{background:#FDBA74}.tv-pri.p-Low{background:#7D7A75}.tv-pri.p-Onhold{background:#93C5FD}
.tv-grab-t{font-size:20px;color:#C9C6C0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-grab em{font-style:normal;font-size:17px;color:#7D7A75;font-variant-numeric:tabular-nums}
body.tv-on .mc-confetti{z-index:9500}
@media (prefers-reduced-motion:reduce){#tv .tv-wb,#tv .tv-sc,#tv .tv-person,#tv .tv-grab{animation:none}}
.tv-live.stale{color:#FDBA74}.tv-live.stale i{background:#FDBA74}

</style></head>

/* Hackathon TV board (standalone, GitHub Pages). Reads data.json next to this page every 30 seconds.

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const I = n => `<svg class="svg" viewBox="0 0 24 24" aria-hidden="true">${KIT.paths[n] || KIT.paths.details}</svg>`;
const MC_STATUS = { done:['Shipped'], progress:['In progress'], todo:['Up for grabs'] };
const MC_DARK = { done:'#4ADE80', progress:'#A5B4FC', todo:'#FDBA74' };

const MC_HUES = ['#4F46E5', '#0D9488', '#DB2777', '#EA580C', '#0891B2', '#7C3AED', '#277C43', '#2563EB'];
const mcHue = name => MC_HUES[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % MC_HUES.length];
const mcInitials = n => n.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const mcAvatar = (n, size = 28) => { const ph = MC_PHOTOS[n]; return `<span class="mc-av" style="--h:${mcHue(n)};width:${size}px;height:${size}px;font-size:${Math.round(size * .38)}px" title="${esc(n)}">${esc(mcInitials(n))}${ph ? `<img src="${esc(ph)}" alt="" onerror="this.remove()">` : ''}</span>`; };
const mcSP = name => { const m = /\[(\d+(?:\.\d+)?)\s*SP\]/i.exec(name || ''); return m ? +m[1] : 0; };
const mcFmt = n => Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/\.?0+$/, '');
const mcAgo = t => { const s = (Date.now() - new Date(t)) / 1000; if (!(s >= 0)) return ''; return s < 90 ? 'just now' : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`; };
/* Status and Priority can come back as { index }; these are the board's label indexes */
const STATUS_IDX = { 0:'In Progress', 1:'Done', 2:'Blocked', 5:'Not Started' };
const PRI_IDX = { 0:'High', 1:'Medium', 2:'Low', 3:'On hold' };
const SUB_IDX = { 0:'Stuck', 1:'Working on it', 2:'Done' };
const labelOf = (x, map) => typeof x === 'string' ? x : x?.text || x?.label || (x && x.index != null ? map[x.index] || '' : '');
const peopleOf = v => !v ? [] : typeof v === 'string' ? v.split(',').map(x => x.trim()).filter(Boolean) : typeof v?.text === 'string' ? peopleOf(v.text) : [];
const mcShipped = (label, subs) => (label || '').toLowerCase() === 'done' || (subs.length > 0 && subs.every(x => (x.status || '').toLowerCase() === 'done'));

let BOARD_DATA = null;
function mcModel() {
  const raw = (BOARD_DATA?.items || []).filter(it => !KIT.kit[it.id]?.live).map(it => { const cv = it.column_values || {};
    return { id:String(it.id), name:it.name, updated:it.updated_at, owners:peopleOf(cv.multiple_person_mm7g67d6), status:labelOf(cv.color_mm7gfa0n, STATUS_IDX), pri:labelOf(cv.color_mm7gznpe, PRI_IDX), sp:cv.numeric_mm7gk419 == null ? '' : String(cv.numeric_mm7gk419),
      subs:(it.subitems || []).map(s => ({ name:s.name, owners:peopleOf(s.column_values?.person), status:labelOf(s.column_values?.status, SUB_IDX) })) }; });
  const items = raw.map(it => {
    const subs = it.subs.map(s => ({ ...s, sp:mcSP(s.name), done:(s.status || '').toLowerCase() === 'done' }));
    const sp = subs.reduce((a, s) => a + s.sp, 0) || +it.sp || 0;
    const people = [...new Set([...it.owners, ...subs.flatMap(s => s.owners)])];
    const st = mcShipped(it.status, subs) ? 'done' : people.length ? 'progress' : 'todo';
    const doneSP = st === 'done' ? sp : subs.filter(s => s.done).reduce((a, s) => a + s.sp, 0);
    return { ...it, subs, sp, doneSP, st, people, pri: MC_PRI_RANK[it.pri] != null ? it.pri : 'Not set' };
  });
  const total = items.reduce((a, x) => a + x.sp, 0), done = items.reduce((a, x) => a + x.doneSP, 0);
  const count = k => items.filter(x => x.st === k).length;
  const lanes = {};
  for (const it of items) for (const p of it.people) (lanes[p] ||= []).push(it);
  return { items, total, done, pct: total ? Math.round(done / total * 100) : 0, counts:{ done:count('done'), progress:count('progress'), todo:count('todo') }, grabs: items.filter(x => !x.people.length && x.st !== 'done'), lanes };
}

const TV = { idle:null, w:{}, data:null };

function tvData() {
  const M = mcModel();

  const people = Object.entries(M.lanes).map(([p, l]) => [p, l.filter(x => x.st === 'progress')]).filter(([, l]) => l.length).sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
  const grabs = [...M.grabs].sort((a, b) => MC_PRI_RANK[a.pri] - MC_PRI_RANK[b.pri] || b.sp - a.sp);

const tvIcon = it => { const k = KIT.kit[it.id]; const ic = k?.ic || 'details', col = k?.col || '#A19E99';

  const title = { shipped:'Shipped', people:'Who\'s on what', grabs:'Up for grabs' }[k], ic = { shipped:'rocket', people:'users', grabs:'hand' }[k];
  return `<section class="tv-w tv-w-${k}" data-w="${k}"><header class="tv-wh">${I(ic)}<h3>${title}</h3><span class="tv-n">${all.length}</span><span class="tv-sp"></span>${tvDots(k, w.n)}</header>
    <div class="tv-wb">${tvBody(k, pages[w.page])}</div></section>`;
}
function tvSummary() {
  const M = TV.data.M;
  const bar = ['done', 'progress', 'todo'].map(k => `<i style="--w:${M.items.length ? M.counts[k] / M.items.length * 100 : 0}%;--c:${MC_DARK[k]}"></i>`).join('');
  const kpi = (k, n) => `<div class="tv-kpi"><span><i style="background:${MC_DARK[k]}"></i>${MC_STATUS[k][0]}</span><b>${n}</b></div>`;
  return `<section class="tv-w tv-sum">
    <div class="tv-kpi tv-prog-k"><span>Progress</span><div class="tv-pk"><b>${M.pct}<small>%</small></b><em>${mcFmt(M.done)} of ${mcFmt(M.total)} SP</em></div><div class="tv-bar">${bar}</div></div>
    ${kpi('done', M.counts.done)}${kpi('progress', M.counts.progress)}${kpi('todo', M.counts.todo)}
    <div class="tv-kpi"><span>People on it</span><b>${Object.keys(M.lanes).length}<small> / ${M.items.length} actions</small></b></div>
  </section>`;
}
function tvRender() {
  const st = document.querySelector('#tv .tv-stage'); if (!st) return;
  TV.data = tvData();
  const at = BOARD_DATA?.fetchedAt ? new Date(BOARD_DATA.fetchedAt).getTime() : 0, stale = !at || Date.now() - at > 15 * 60000;
  const hm = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  st.innerHTML = `<header class="tv-top"><div class="tv-title"><h1>Workflows actions hackathon</h1></div>
      <div class="tv-top-r"><span class="tv-live ${stale ? 'stale' : 'on'}"><i></i>${at ? `Updated ${mcAgo(at)}` : 'Waiting for data'}</span><span class="tv-clock">${hm}</span></div></header>
    <div class="tv-grid">${tvSummary()}${tvWidget('shipped')}${tvWidget('people')}${tvWidget('grabs')}</div>`;
}
function tvTurn(k) {
  const w = TV.w[k];
  if (w.n > 1) { w.page = (w.page + 1) % w.n; w.start = Date.now(); const el = document.querySelector(`#tv [data-w="${k}"]`); if (el) el.outerHTML = tvWidget(k); }
  else w.start = Date.now();
  clearTimeout(w.t); w.t = setTimeout(() => tvTurn(k), TV_W[k].dwell);
}
function tvFit() { const st = document.querySelector('#tv .tv-stage'); if (st) st.style.transform = `translate(-50%, -50%) scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; }
function tvWake() { const el = document.getElementById('tv'); el.classList.remove('idle'); clearTimeout(TV.idle); TV.idle = setTimeout(() => el.classList.add('idle'), 2500); }
async function load() {
  try { const r = await fetch(`data.json?t=${Date.now()}`, { cache:'no-store' }); if (r.ok) { BOARD_DATA = await r.json(); tvRender(); } } catch (e) { /* keep what's on screen */ }
}
(async () => {
  const now = Date.now();
  for (const k of Object.keys(TV_W)) { TV.w[k] = { page:0, start:now + TV_W[k].lag, n:1 }; TV.w[k].t = setTimeout(() => tvTurn(k), TV_W[k].dwell + TV_W[k].lag); }
  await load(); tvRender(); tvFit(); tvWake();
  setInterval(load, 30000); setInterval(tvRender, 30000);
  addEventListener('resize', tvFit); document.addEventListener('mousemove', tvWake);
  document.addEventListener('click', e => { if (e.target.closest('[data-tvfs]')) document.fullscreenElement ? document.exitFullscreen?.() : document.documentElement.requestFullscreen?.().catch(() => {}); });
})();
</script>
</body></html>
